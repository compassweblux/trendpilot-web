{% extends "base.html" %}
{% block title %}Konto erstellen — {{ product }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-card card">
    <h2>Konto erstellen</h2>
    <p class="sub">Kostenlos registrieren, Kundennummer erhalten und den Bot sofort herunterladen.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <label for="name">Name (optional)</label>
      <input type="text" id="name" name="name" placeholder="Max Mustermann" autocomplete="name">
      <label for="email">E-Mail-Adresse</label>
      <input type="email" id="email" name="email" required placeholder="du@beispiel.de" autocomplete="email">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" required minlength="8" placeholder="Mindestens 8 Zeichen" autocomplete="new-password">
      <label for="password2">Passwort wiederholen</label>
      <input type="password" id="password2" name="password2" required minlength="8" placeholder="Passwort erneut eingeben" autocomplete="new-password">
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:22px">Konto erstellen &amp; Kundennummer erhalten</button>
    </form>
    <p class="muted-link">Schon ein Konto? <a href="/login">Jetzt anmelden</a></p>
  </div>
</div>
{% endblock %}
